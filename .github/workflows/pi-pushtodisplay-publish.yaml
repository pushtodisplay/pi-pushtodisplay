name: pi-pushtodisplay Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
      version_bump:
        description: "Version bump (none publishes the current package.json version; use for the first release)"
        required: false
        type: choice
        default: patch
        options:
          - none
          - patch
          - minor
          - major
      use_npm_token:
        description: "Use NPM_TOKEN instead of Trusted Publishing (only for a package without a Trusted Publisher)"
        required: false
        type: boolean
        default: false
      npm_tag:
        description: "Override npm dist-tag (leave empty for default: stable->latest, pre-release->release_type)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: pi-pushtodisplay-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pi-pushtodisplay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check (lint + typecheck + tests)
        run: npm run check

      - name: Determine version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BASE=$(echo "$CURRENT" | sed 's/-.*//')

          if [[ "${{ inputs.version_bump }}" == "none" ]]; then
            if [[ "${{ inputs.release_type }}" != "stable" ]]; then
              echo "::error::version_bump=none is only valid with release_type=stable"
              exit 1
            fi
            NEW_VERSION="$CURRENT"
          else
            # Bump base version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "${{ inputs.version_bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            BUMPED="${MAJOR}.${MINOR}.${PATCH}"

            if [[ "${{ inputs.release_type }}" == "stable" ]]; then
              NEW_VERSION="$BUMPED"
            else
              # Find the next pre-release number by parsing all existing versions
              TAG="${{ inputs.release_type }}"
              PRE_NUM=$(node -e "
                const versions = JSON.parse(require('child_process').execSync(
                  'npm view pi-pushtodisplay versions --json', { encoding: 'utf8' }
                ).trim() || '[]');
                const prefix = '${BUMPED}-${TAG}.';
                const max = versions
                  .filter(v => v.startsWith(prefix))
                  .map(v => parseInt(v.slice(prefix.length), 10))
                  .filter(n => !isNaN(n))
                  .reduce((a, b) => Math.max(a, b), -1);
                console.log(max + 1);
              " 2>/dev/null || echo "0")

              NEW_VERSION="${BUMPED}-${TAG}.${PRE_NUM}"
            fi
          fi

          # Determine npm dist-tag: explicit override > default (stable->latest, pre-release->release_type)
          if [[ -n "${{ inputs.npm_tag }}" ]]; then
            DIST_TAG="${{ inputs.npm_tag }}"
          elif [[ "${{ inputs.release_type }}" == "stable" ]]; then
            DIST_TAG="latest"
          else
            DIST_TAG="${{ inputs.release_type }}"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Will publish pi-pushtodisplay@${NEW_VERSION} with tag: ${DIST_TAG}"

      - name: Set version in package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pi-pushtodisplay-pack.txt
          if grep -q "src/__tests__" /tmp/pi-pushtodisplay-pack.txt; then
            echo "::error::test files are included in the published tarball"
            exit 1
          fi

      - name: Select publish authentication
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${{ inputs.use_npm_token }}" == "true" && -n "$NPM_TOKEN" ]]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "Using NPM_TOKEN for this publish."
          else
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Using npm Trusted Publishing (OIDC)."
          fi

      - name: Publish to npm (NPM_TOKEN first-publish fallback)
        if: ${{ inputs.dry_run == false && steps.auth.outputs.method == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: ${{ inputs.dry_run == false && steps.auth.outputs.method == 'oidc' }}
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"

      - name: Dry run publish
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN - would publish:"
          echo "  Package: pi-pushtodisplay@${{ steps.version.outputs.version }}"
          echo "  Tag: ${{ steps.version.outputs.tag }}"

      - name: Commit version & create git tag
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: release v${{ steps.version.outputs.version }}"
          fi
          git tag "pi-pushtodisplay-v${{ steps.version.outputs.version }}"
          git push origin HEAD:main "pi-pushtodisplay-v${{ steps.version.outputs.version }}"

      - name: Verify publish
        if: ${{ inputs.dry_run == false }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for npm registry propagation and tarball availability..."
          READY=0
          for attempt in {1..24}; do
            if npm view "pi-pushtodisplay@$VERSION" version >/dev/null 2>&1; then
              TARBALL=$(npm view "pi-pushtodisplay@$VERSION" dist.tarball)
              if [ -n "$TARBALL" ] && curl -fsS -o /dev/null --max-time 20 "$TARBALL"; then
                READY=1
                break
              fi
            fi
            echo "Attempt $attempt/24: $VERSION not fully available yet; retrying in 10s..."
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::pi-pushtodisplay@$VERSION was published but its tarball is not reachable after 4 minutes"
            exit 1
          fi
          npm view "pi-pushtodisplay@$VERSION" version
          npm view pi-pushtodisplay dist-tags --json
          KEYWORDS=$(npm view pi-pushtodisplay keywords --json)
          echo "$KEYWORDS"
          if ! grep -q '"pi-package"' <<< "$KEYWORDS"; then
            echo "::error::published package is missing the pi-package keyword"
            exit 1
          fi
          curl -fsS --max-time 15 "https://pi.dev/packages/pi-pushtodisplay" > /dev/null \
            && echo "Pi catalog page is live" \
            || echo "Pi catalog page is not live yet (crawler lag); package is published"
